<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2-1반 닭강정 맛 투표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FFF8EE; --ink:#2B1A10; --muted:#7A6656; --card:#fff; --line:#EADBC8; --pri:#E5432F; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Noto Sans KR",system-ui,sans-serif; }
  .wrap { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:26px; font-weight:900; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  label.no { display:block; font-weight:700; margin-bottom:8px; }
  select { font:inherit; font-size:18px; padding:10px 12px; border:2px solid var(--line); border-radius:12px; background:#fff; width:100%; max-width:220px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0; }
  .opt { position:relative; background:var(--card); border:3px solid var(--line); border-radius:16px; overflow:hidden; cursor:pointer; padding:0; font:inherit; text-align:left; transition:transform .1s, border-color .1s; }
  .opt img { display:block; width:100%; height:auto; }
  .opt:active { transform:scale(.98); }
  .opt.sel { border-color:var(--pri); box-shadow:0 0 0 3px #E5432F33; }
  .opt.sel::after { content:"✓"; position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:50%; background:var(--pri); color:#fff; display:grid; place-items:center; font-weight:900; }
  .btn { width:100%; font:inherit; font-size:20px; font-weight:900; padding:16px; border:0; border-radius:14px; background:var(--pri); color:#fff; cursor:pointer; }
  .btn:disabled { background:#d9c9b8; cursor:not-allowed; }
  .msg { margin-top:14px; padding:14px; border-radius:12px; display:none; font-weight:700; }
  .msg.ok { display:block; background:#E7F6EA; color:#1E6B34; }
  .msg.err { display:block; background:#FDE8E5; color:#A3281A; }
  /* results */
  .bars { display:flex; flex-direction:column; gap:14px; margin:20px 0; }
  .bar-row { display:grid; grid-template-columns:110px 1fr 70px; align-items:center; gap:10px; }
  .bar-bg { background:#EFE3D3; border-radius:10px; height:34px; overflow:hidden; }
  .bar { height:100%; border-radius:10px; width:0; transition:width .6s; }
  .bar-row b { font-size:17px; }
  .num { text-align:right; font-weight:900; font-size:18px; }
  .stat { display:flex; gap:12px; flex-wrap:wrap; }
  .stat div { background:#fff; border:2px solid var(--line); border-radius:12px; padding:10px 14px; }
  .stat strong { font-size:22px; }
  .missing { color:var(--muted); line-height:1.8; }
  .hidden { display:none; }
  .foot { margin-top:28px; font-size:13px; color:var(--muted); }
  .foot a { color:var(--muted); }
  @media (max-width:420px){ .bar-row{ grid-template-columns:86px 1fr 56px; } h1{font-size:22px;} }
</style>
</head>
<body>
<div class="wrap">

  <!-- 투표 화면 -->
  <section id="voteView">
    <h1>🍗 2-1반 학급단합 닭강정 파티</h1>
    <p class="sub">먹고 싶은 맛을 하나 골라 주세요! 다시 투표하면 마지막 선택으로 바뀌어요.</p>

    <label class="no" for="no">내 번호</label>
    <select id="no"><option value="">번호 선택</option></select>

    <div class="grid" id="grid"></div>

    <button class="btn" id="submit" disabled>투표하기</button>
    <div class="msg" id="msg"></div>
  </section>

  <!-- 결과 화면 (?result) -->
  <section id="resultView" class="hidden">
    <h1>📊 닭강정 맛 투표 결과</h1>
    <p class="sub">5초마다 자동으로 새로고침돼요.</p>
    <div class="stat">
      <div>참여 <strong id="cnt">0</strong>명 / <span id="total"></span>명</div>
      <div>1위 <strong id="top">-</strong></div>
    </div>
    <div class="bars" id="bars"></div>
    <p class="missing"><b>아직 안 한 번호:</b> <span id="missing">-</span></p>
  </section>

  <p class="foot"><a href="?result" id="toResult">결과 보기</a></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ===== 설정 =====
  const SUPABASE_URL = "https://gugayuzfxhpohflfzona.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_OZqZTlU0Dv6bVWkGawQFsA_ydaGH9uC";
  const CLASS_SIZE = 30; // 반 인원수
  // ================

  const FLAVORS = [
    { id: "spicy",  name: "약간 매운맛", img: "img/chicken_1_spicy.jpg",  color: "#E5432F" },
    { id: "soy",    name: "간장맛",     img: "img/chicken_2_soy.jpg",    color: "#7A4A22" },
    { id: "cheese", name: "치즈맛",     img: "img/chicken_3_cheese.jpg", color: "#E0A400" },
    { id: "fried",  name: "후라이드",   img: "img/chicken_4_fried.jpg",  color: "#C77A12" },
  ];
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const isResult = new URLSearchParams(location.search).has("result");

  if (isResult) {
    document.getElementById("voteView").classList.add("hidden");
    document.getElementById("resultView").classList.remove("hidden");
    document.getElementById("toResult").textContent = "투표하러 가기";
    document.getElementById("toResult").href = "./";
    loadResults();
    setInterval(loadResults, 5000);
  } else {
    initVote();
  }

  function initVote() {
    const sel = document.getElementById("no");
    for (let i = 1; i <= CLASS_SIZE; i++) sel.add(new Option(i + "번", i));
    const grid = document.getElementById("grid");
    let picked = null;
    FLAVORS.forEach(f => {
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.innerHTML = `<img src="${f.img}" alt="${f.name}">`;
      b.onclick = () => {
        picked = f.id;
        grid.querySelectorAll(".opt").forEach(x => x.classList.remove("sel"));
        b.classList.add("sel"); update();
      };
      grid.appendChild(b);
    });
    const btn = document.getElementById("submit");
    const update = () => btn.disabled = !(picked && sel.value);
    sel.onchange = update;
    btn.onclick = async () => {
      btn.disabled = true;
      const msg = document.getElementById("msg");
      msg.className = "msg";
      const { error } = await sb.from("chicken_votes")
        .upsert({ student_no: Number(sel.value), flavor: picked, voted_at: new Date().toISOString() },
                { onConflict: "student_no" });
      if (error) {
        msg.className = "msg err"; msg.textContent = "저장에 실패했어요. 선생님께 알려 주세요. (" + error.message + ")";
        update();
      } else {
        const name = FLAVORS.find(f => f.id === picked).name;
        msg.className = "msg ok"; msg.textContent = `${sel.value}번, '${name}'에 투표 완료! 🎉`;
        update();
      }
    };
  }

  async function loadResults() {
    const { data, error } = await sb.from("chicken_votes").select("student_no, flavor");
    if (error) { document.getElementById("missing").textContent = "불러오기 실패: " + error.message; return; }
    const counts = Object.fromEntries(FLAVORS.map(f => [f.id, 0]));
    data.forEach(r => { if (r.flavor in counts) counts[r.flavor]++; });
    const n = data.length;
    document.getElementById("cnt").textContent = n;
    document.getElementById("total").textContent = CLASS_SIZE;
    const max = Math.max(...Object.values(counts));
    const tops = FLAVORS.filter(f => counts[f.id] === max && max > 0).map(f => f.name);
    document.getElementById("top").textContent = tops.length ? tops.join(", ") : "-";
    const bars = document.getElementById("bars");
    bars.innerHTML = "";
    FLAVORS.forEach(f => {
      const pct = n ? Math.round(counts[f.id] / n * 100) : 0;
      const row = document.createElement("div");
      row.className = "bar-row";
      row.innerHTML = `<b>${f.name}</b><div class="bar-bg"><div class="bar" style="background:${f.color}"></div></div><div class="num">${counts[f.id]}표 <small>${pct}%</small></div>`;
      bars.appendChild(row);
      requestAnimationFrame(() => row.querySelector(".bar").style.width = (max ? counts[f.id] / max * 100 : 0) + "%");
    });
    const voted = new Set(data.map(r => r.student_no));
    const miss = []; for (let i = 1; i <= CLASS_SIZE; i++) if (!voted.has(i)) miss.push(i);
    document.getElementById("missing").textContent = miss.length ? miss.join(", ") + "번" : "모두 참여했어요! 🎉";
  }
</script>
</body>
</html>
